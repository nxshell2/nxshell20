name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-package-check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            timeout: 60
          - os: windows-latest
            timeout: 90
          - os: macos-latest
            timeout: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            core/node_modules
            shell/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: make install

      - name: Build core (main process)
        run: make core

      - name: Build shell (renderer)
        run: make shell

      - name: Package application for testing
        run: make dist

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.os }}-${{ github.run_id }}
          path: dist/apppackage/
          retention-days: 3
          if-no-files-found: ignore
