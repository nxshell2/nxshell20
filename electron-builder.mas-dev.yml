appId: nxshell2.nxshell.com
productName: NxShell
copyright: Copyright © 2020-2021 NxShell Team
artifactName: ${productName}-${arch}-${os}-${version}-${env.buildTimes}.${ext}
electronVersion: 43.2.0
extraResources:
  - from: pack/native/node_modules
    to: node_modules
  - from: build/resources/nxshell.png
    to: nxshell.png
files:
  - filter: "!native"
directories:
  buildResources: build/resources
  output: dist/apppackage
  app: pack
mac:
  target:
    - mas
  icon: build/resources/mac/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
mas:
  type: development
  hardenedRuntime: false
  asar: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/NxShelldev.provisionprofile
afterPack: ./build/afterPackHook.js
