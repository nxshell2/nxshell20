name: Release

on:
  push:
    tags:
      - 'release/v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            core/node_modules
            shell/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#release/v}" >> "$GITHUB_OUTPUT"
      - run: make dist VERSION=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/apppackage/
          retention-days: 1
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            core/node_modules
            shell/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#release/v}" >> "$GITHUB_OUTPUT"
      - run: make dist VERSION=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/apppackage/
          retention-days: 1
          if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            core/node_modules
            shell/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#release/v}" >> "$GITHUB_OUTPUT"
      - run: make dist VERSION=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/apppackage/
          retention-days: 1
          if-no-files-found: ignore

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#release/v}" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.appx' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release-assets/ \;
          ls -la release-assets/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
